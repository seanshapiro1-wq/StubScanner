<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Geometric Dash</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #07070f;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  canvas {
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
    box-shadow: 0 0 60px rgba(60, 120, 255, .25);
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="540"></canvas>
</div>
<script src="game.js"></script>
</body>
</html>
